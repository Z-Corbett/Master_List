name: Playwright

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Only one deploy at a time; a newer push waits rather than racing an older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node scripts/build-data.mjs
      - name: Fail if data/projects.js is stale
        run: git diff --exit-code data/projects.js
      - name: Fail if the homepage test count differs from Playwright's
        run: |
          listed=$(npx playwright test --list | sed -nE 's/^Total: ([0-9]+) tests.*/\1/p')
          shown=$(node -e "global.window={};require('./data/projects.js');console.log(window.SUITE.total)")
          echo "playwright: $listed, homepage: $shown"
          test "$listed" = "$shown"
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # GitHub Pages is set to deploy from Actions, so the site only updates when every test above passes.
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
